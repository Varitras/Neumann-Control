[workspace]
members = ["crates/core", "crates/app", "crates/manual"]
resolver = "2"

[workspace.package]
# Fixed: the product version is in VERSION (see crates/app/build.rs).
version = "0.0.0"
edition = "2021"
authors = ["Varitras"]
license = "MIT"
repository = "https://github.com/Varitras/Neumann-Control"
rust-version = "1.95"

# Our own crates keep file and line for panics and backtraces, but no variable
# information; set `debug = true` locally to inspect variables in a debugger.
[profile.dev]
debug = "line-tables-only"

# Dependencies carry no debug info in dev and test builds: their PDBs made up
# most of a target directory that grew past 40 GB.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true
