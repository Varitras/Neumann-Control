# Path catalog of neumann-control.
#
# This file mirrors custom_components/neumann_kh/const.py of neumann-connect (Home Assistant
# integration), synced from version 1.19.1 plus its later change of `ui/control_mode` to a
# read-only sensor (the rear CONTROL switch sets it; a write answers 405 on both models).
# Model knowledge lives here and nowhere in code:
# which model has a path (`class`), where it may be written (`writable_on`, exact product
# strings as the device reports them) and how often it is polled (`poll`). A product that is
# not listed in `writable_on` is read-only, so unmeasured models never get a write.
#
# Labels are German UI copy. Out of scope (not listed): EQ, restore, save_settings, out5,
# mixer, mute_persist, update, auth, system, time, macs.

[models]
# Models with subwoofer features; every other product counts as a monitor.
subwoofer = ["KH 750", "KH 750 DSP"]
# Models with a logo brightness setting.
logo = ["KH 80", "KH 80 DSP", "KH 150", "KH 150 AES67", "KH 120", "KH 120 II", "KH 120 II AES67"]


[[entry]]
path = "device/identity/product"
label = "Produkt"
group = "device"
kind = "display"
poll = "once"
class = "all"

[[entry]]
path = "device/identity/version"
label = "Firmware-Version"
group = "device"
kind = "display"
poll = "once"
class = "all"

[[entry]]
path = "device/identity/serial"
label = "Seriennummer"
group = "device"
kind = "display"
poll = "once"
class = "all"

[[entry]]
path = "device/identity/vendor"
label = "Hersteller"
group = "device"
kind = "display"
poll = "once"
class = "all"

[[entry]]
path = "device/identity/hw_version"
label = "Hardware-Version"
group = "device"
kind = "display"
poll = "slow"
class = "all"

[[entry]]
path = "audio/out/level"
label = "Pegel"
group = "output"
kind = "number"
poll = "fast"
class = "all"
unit = "dB SPL"
min = 0
max = 120
writable_on = ["KH 120 II", "KH 750"]

[[entry]]
path = "audio/out/delay"
label = "Verzögerung"
group = "output"
kind = "number"
poll = "fast"
class = "all"
unit = "1/48 kHz"
min = 0
max = 5760
max_subwoofer = 1000
step = 1
writable_on = ["KH 120 II", "KH 750"]

[[entry]]
path = "audio/out/mute"
label = "Stumm"
group = "output"
kind = "switch"
poll = "fast"
class = "all"
writable_on = ["KH 120 II", "KH 750"]

[[entry]]
path = "audio/out/phaseinversion"
