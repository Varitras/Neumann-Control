[package]
name = "neumann-control-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "neumann-control"
path = "src/main.rs"

[lib]
name = "neumann_control_app"
path = "src/lib.rs"

[dependencies]
neumann-control-core = { path = "../core" }
serde_json = "1"
eframe = "0.36"
log = "0.4"
simplelog = "0.12"
# Already in the tree through eframe; lists the monitors to place the window at the start.
winit = "0.30"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe"] }
neumann-control-core = { path = "../core", features = ["test-support"] }
tempfile = "3"
