# A tag v<version> on main builds the release for Windows and Linux on clean runners and attaches
# both to a draft GitHub release; publishing the draft stays a manual step.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.agree.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: the tag must be proven to lie on main.
          fetch-depth: 0
      - name: Tag, main and version agree
        id: agree
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $manifest = Get-Content Cargo.toml -Raw
          if ($manifest -notmatch '(?s)\[workspace\.package\][^\[]*?\nversion = "([^"]+)"') {
            throw 'no [workspace.package] version in Cargo.toml'
          }
          $version = $Matches[1]
          if ($tag -ne "v$version") { throw "tag $tag does not match version $version" }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "tag $tag is not on main" }
          "version=$version" >> $env:GITHUB_OUTPUT

  build:
    needs: version
    strategy:
      matrix:
        include:
          - runner: windows-latest
            folder: neumann-control-${{ needs.version.outputs.version }}
            archive: neumann-control-${{ needs.version.outputs.version }}.zip
          # Not ubuntu-latest: the binary needs the runner's glibc, and build-release.ps1 refuses
          # one newer than 2.39, so a moved ubuntu-latest would fail the release.
          - runner: ubuntu-24.04
            folder: neumann-control-${{ needs.version.outputs.version }}-linux-x86_64
            archive: neumann-control-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9,cargo-audit
      # The gate and the build, as locally; the version stays the tag's.
      - name: Build the release folder
        shell: pwsh
        run: ./build-release.ps1 -KeepVersion
      # tar keeps the executable bit, which a zip made on Linux would not carry to every tool.
      - name: Pack the release folder
        shell: pwsh
        run: |
          Set-Location release
          if ($IsWindows) {
            Compress-Archive -Path '${{ matrix.folder }}' -DestinationPath '${{ matrix.archive }}'
          } else {
            tar -czf '${{ matrix.archive }}' '${{ matrix.folder }}'
          }
          if ($LASTEXITCODE -ne 0) { throw "packing failed ($LASTEXITCODE)" }
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: release/${{ matrix.archive }}
          if-no-files-found: error

  draft:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: archives
          merge-multiple: true
      - name: Release notes from the CHANGELOG
        shell: pwsh
        run: ./release-notes.ps1 -Version $env:VERSION -OutFile "$env:RUNNER_TEMP/release-notes.md"
      - name: Draft the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archives = @(
            "archives/neumann-control-$env:VERSION.zip",
            "archives/neumann-control-$env:VERSION-linux-x86_64.tar.gz"
          )
          # One list for both downloads, as `sha256sum -c SHA256SUMS` reads it next to them.
          $sums = $archives | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $(Split-Path $_ -Leaf)"
          }
          [System.IO.File]::WriteAllText("$PWD/archives/SHA256SUMS", (($sums -join "`n") + "`n"))
          $arguments = @(
            'release', 'create', '${{ github.ref_name }}', '--draft', '--verify-tag',
            '--title', "Neumann Control $env:VERSION",
            '--notes-file', "$env:RUNNER_TEMP/release-notes.md"
          )
          # Below 1.0 the app is an alpha, and a version with a suffix (-alpha.1) is a pre-release
          # by its name: both are marked as a prerelease on GitHub.
          if ($env:VERSION -match '^0\.|-') { $arguments += '--prerelease' }
          $arguments += $archives + 'archives/SHA256SUMS'
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
