# A tag v<version> on main builds the release on a clean runner and attaches it to a draft
# GitHub release; publishing the draft stays a manual step.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: the tag must be proven to lie on main.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9,cargo-audit
      - name: Tag, main and version agree
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $manifest = Get-Content Cargo.toml -Raw
          if ($manifest -notmatch '(?s)\[workspace\.package\][^\[]*?\nversion = "([^"]+)"') {
            throw 'no [workspace.package] version in Cargo.toml'
          }
          $version = $Matches[1]
          if ($tag -ne "v$version") { throw "tag $tag does not match version $version" }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "tag $tag is not on main" }
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: Release notes from the CHANGELOG
        shell: pwsh
        run: ./release-notes.ps1 -Version $env:VERSION -OutFile "$env:RUNNER_TEMP/release-notes.md"
      # The gate and the build, as locally; the version stays the tag's.
      - name: Build the release folder
        shell: pwsh
        run: ./build-release.ps1 -KeepVersion
      - name: Draft the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $folder = "release/neumann-control-$env:VERSION"
          Compress-Archive -Path $folder -DestinationPath "release/neumann-control-$env:VERSION.zip"
          $arguments = @(
            'release', 'create', '${{ github.ref_name }}', '--draft', '--verify-tag',
            '--title', "Neumann Control $env:VERSION",
            '--notes-file', "$env:RUNNER_TEMP/release-notes.md"
          )
          # Below 1.0 the app is an alpha, and a version with a suffix (-alpha.1) is a pre-release
          # by its name: both are marked as a prerelease on GitHub.
          if ($env:VERSION -match '^0\.|-') { $arguments += '--prerelease' }
          $arguments += "release/neumann-control-$env:VERSION.zip", "$folder/SHA256SUMS"
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
