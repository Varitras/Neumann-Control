targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = false

# The set actually present in the release dependency graph of the workspace,
# found by running `cargo about generate` once with a permissive list and
# tightening. OFL-1.1 and Ubuntu-font-1.0 come with egui's default fonts
# (epaint_default_fonts), which stay as the emoji and symbol fallback.
# GPL/LGPL/AGPL are deliberately not accepted; if one appears, the gate fails.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
